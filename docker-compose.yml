services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wealthquest
      POSTGRES_PASSWORD: wealthquest
      POSTGRES_DB: wealthquest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthquest -d wealthquest"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://wealthquest:wealthquest@db:5432/wealthquest
      AUTH_SECRET: local-docker-secret-change-me
      NEXTAUTH_SECRET: local-docker-secret-change-me
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_MULTIPLAYER_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - gamedata:/app/.data

volumes:
  pgdata:
  gamedata:
